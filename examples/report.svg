  <text x="232" y="851.52" font-size="16" fill="#1a1a1a" font-weight="bold">Input</text>
  <text x="426.8" y="851.52" font-size="16" fill="#1a1a1a" font-weight="bold">Timed</text>
  <text x="471.6" y="851.52" font-size="16" fill="#1a1a1a" font-weight="bold"> </text>
