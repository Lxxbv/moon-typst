<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="48" y="96.48" font-size="28.8" fill="#1a1a1a" font-weight="bold">High-Performance Markup Typography on WebAssembly</text>
  <text x="48" y="146.48" font-size="22.4" fill="#1a1a1a" font-weight="bold">Abstract</text>
  <text x="48" y="170.16" font-size="16" fill="#1a1a1a">Modern document preparation systems demand both instant feedback and high typographical precision. While traditional systems like LaTeX provide rich typesetting capabilities, their compilation latency and complex dependencies hinder cloud-native interactive workflows. Typst introduced a modern syntax and incremental layout model.</text>
  <text x="48" y="202.16" font-size="16" fill="#1a1a1a">In this work, we present </text>
  <text x="243.20000000000005" y="202.16" font-size="16" fill="#1a1a1a" font-weight="bold">moon-typst</text>
  <text x="48" y="226.16" font-size="16" fill="#1a1a1a">, an end-to-end typographical compiler implemented entirely in the MoonBit programming language. We demonstrate sub-millisecond AST construction, streaming box layout, and dual-target vector generation.</text>
  <text x="48" y="281.6" font-size="22.4" fill="#1a1a1a" font-weight="bold">Mathematical Foundation</text>
  <text x="48" y="305.28000000000003" font-size="16" fill="#1a1a1a">The vertical spacing distribution model follows standard typographical baseline kinetics:</text>
  <text x="80" y="356" font-size="19.2" fill="#24292f" font-style="italic">E</text>
  <text x="90.56" y="356" font-size="19.2" fill="#24292f"> = </text>
  <text x="112.64" y="356" font-size="19.2" fill="#24292f" font-style="italic">m</text>
  <text x="128" y="356" font-size="19.2" fill="#24292f" font-style="italic">c</text>
  <text x="138.56" y="356" font-size="19.2" fill="#24292f"> ^ </text>
  <text x="160.64" y="356" font-size="19.2" fill="#24292f" font-style="italic">2</text>
  <text x="48" y="398.08000000000004" font-size="16" fill="#1a1a1a">Furthermore, inline formulations such as </text>
  <text x="371.20000000000016" y="398.08000000000004" font-size="16" fill="#24292f" font-style="italic">f</text>
  <text x="380.00000000000017" y="398.08000000000004" font-size="16" fill="#24292f" font-style="italic">x</text>
  <text x="388.8000000000002" y="398.08000000000004" font-size="16" fill="#24292f"> = </text>
  <text x="407.20000000000016" y="398.08000000000004" font-size="16" fill="#24292f">√</text>
  <text x="423.20000000000016" y="398.08000000000004" font-size="16" fill="#24292f" font-style="italic">x</text>
  <text x="432.00000000000017" y="398.08000000000004" font-size="16" fill="#24292f"> ^ </text>
  <text x="450.40000000000015" y="398.08000000000004" font-size="16" fill="#24292f" font-style="italic">2</text>
  <text x="459.20000000000016" y="398.08000000000004" font-size="16" fill="#24292f"> + </text>
  <text x="477.60000000000014" y="398.08000000000004" font-size="16" fill="#24292f" font-style="italic">1</text>
  <text x="486.40000000000015" y="398.08000000000004" font-size="16" fill="#1a1a1a"> and fraction derivations:</text>
  <text x="80" y="448.8" font-size="19.2" fill="#24292f" font-style="italic">frac</text>
  <text x="122.24000000000001" y="448.8" font-size="19.2" fill="#24292f" font-style="italic">a</text>
  <text x="132.8" y="448.8" font-size="19.2" fill="#24292f"> + </text>
  <text x="154.88" y="448.8" font-size="19.2" fill="#24292f" font-style="italic">b</text>
  <text x="165.44" y="448.8" font-size="19.2" fill="#24292f" font-style="italic">,</text>
  <text x="172.16" y="448.8" font-size="19.2" fill="#24292f" font-style="italic">c</text>
  <text x="182.72" y="448.8" font-size="19.2" fill="#24292f"> + </text>
  <text x="204.8" y="448.8" font-size="19.2" fill="#24292f" font-style="italic">d</text>
  <text x="48" y="490.88000000000005" font-size="16" fill="#1a1a1a">maintain harmonic font metrics and balanced baseline alignments across heterogeneous output devices.</text>
  <text x="48" y="546.3199999999999" font-size="22.4" fill="#1a1a1a" font-weight="bold">Architecture Overview</text>
  <text x="48" y="570" font-size="16" fill="#1a1a1a">The system pipeline consists of three decoupled phases:</text>
  <text x="64" y="606" font-size="16" fill="#0969da" font-weight="bold">• </text>
  <text x="88.8" y="606" font-size="16" fill="#1a1a1a">Lexical Tokenization &amp; Parsing: Recursive descent parser yielding lossless AST nodes</text>
  <text x="64" y="634" font-size="16" fill="#0969da" font-weight="bold">• </text>
  <text x="48" y="658" font-size="16" fill="#1a1a1a">Geometric Layout Engine: Bounding box calculation, font metric estimation, and page break partitioning</text>
  <text x="64" y="686" font-size="16" fill="#0969da" font-weight="bold">• </text>
  <text x="48" y="710" font-size="16" fill="#1a1a1a">Dual-Target Vector Renderer: SVG 1.1 vector paths and semantic HTML5 DOM structures</text>
  <text x="48" y="769.4399999999999" font-size="22.4" fill="#1a1a1a" font-weight="bold">Empirical Results</text>
  <text x="48" y="793.12" font-size="16" fill="#1a1a1a">Initial micro-benchmarks indicate an order-of-magnitude throughput improvement over legacy scripting environments when targeting WebAssembly runtimes.</text>
</svg>
