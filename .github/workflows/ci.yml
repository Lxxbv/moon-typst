name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check Toolchain Version
        run: |
          moon version --all

      - name: MoonBit Check (Deny Warnings)
        run: |
          moon check --deny-warn

      - name: Run Test Suite (All Targets)
        run: |
          moon test --deny-warn

      - name: Build WebAssembly Target (wasm-gc)
        run: |
          moon build --target wasm-gc

      - name: Build JavaScript Target (js)
        run: |
          moon build --target js

      - name: Build Native Target (native)
        run: |
          moon build --target native

      - name: Test CLI Executable
        run: |
          moon run cmd/main --target native -- --help

      - name: Verify CLI Rendering Examples
        run: |
          moon run cmd/main --target native -- examples/paper.typ -o test_paper.svg
          moon run cmd/main --target native -- examples/paper.typ --html -o test_paper.html
          moon run cmd/main --target native -- examples/resume.typ -o test_resume.svg
          moon run cmd/main --target native -- examples/report.typ -o test_report.svg
