<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="48" y="96.48" font-size="28.8" fill="#1a1a1a" font-weight="bold">Markup Typography on WebAssembly</text>
  <text x="48" y="146.48" font-size="22.4" fill="#1a1a1a" font-weight="bold">Abstract</text>
  <text x="48" y="170.16" font-size="16" fill="#1a1a1a">Modern document preparation systems demand both instant feedback and high typographical precision. While traditional systems like LaTeX provide rich typesetting capabilities</text>
  <text x="48" y="194.16" font-size="16" fill="#1a1a1a">,</text>
  <text x="48" y="218.16" font-size="16" fill="#1a1a1a"> their compilation latency and complex dependencies hinder cloud-native interactive workflows. Typst introduced a modern syntax and incremental layout model.</text>
  <text x="48" y="250.16" font-size="16" fill="#1a1a1a">In this work</text>
  <text x="143.2" y="250.16" font-size="16" fill="#1a1a1a">,</text>
  <text x="148.79999999999998" y="250.16" font-size="16" fill="#1a1a1a"> we present </text>
  <text x="243.19999999999996" y="250.16" font-size="16" fill="#1a1a1a" font-weight="bold">moon-typst</text>
  <text x="328.79999999999995" y="250.16" font-size="16" fill="#1a1a1a">,</text>
  <text x="48" y="274.16" font-size="16" fill="#1a1a1a"> a typographical compiler implemented in MoonBit. Its parser</text>
  <text x="518.4000000000004" y="274.16" font-size="16" fill="#1a1a1a">,</text>
  <text x="524.0000000000005" y="274.16" font-size="16" fill="#1a1a1a"> box layout</text>
  <text x="606.4000000000004" y="274.16" font-size="16" fill="#1a1a1a">,</text>
  <text x="48" y="298.16" font-size="16" fill="#1a1a1a"> and vector renderers can be measured separately with the checked-in benchmark.</text>
  <text x="48" y="353.6" font-size="22.4" fill="#1a1a1a" font-weight="bold">Mathematical Foundation</text>
  <text x="48" y="377.28000000000003" font-size="16" fill="#1a1a1a">The vertical spacing distribution model follows standard typographical baseline kinetics</text>
  <text x="727.1999999999999" y="377.28000000000003" font-size="16" fill="#1a1a1a">:</text>
  <text x="80" y="428" font-size="19.2" fill="#24292f" font-style="italic">E</text>
  <text x="90.56" y="428" font-size="19.2" fill="#24292f"> = </text>
  <text x="112.64" y="428" font-size="19.2" fill="#24292f" font-style="italic">m</text>
  <text x="128" y="428" font-size="19.2" fill="#24292f" font-style="italic">c</text>
  <text x="138.56" y="428" font-size="19.2" fill="#24292f"> ^ </text>
  <text x="160.64" y="428" font-size="19.2" fill="#24292f" font-style="italic">2</text>
  <text x="48" y="470.08000000000004" font-size="16" fill="#1a1a1a">Furthermore</text>
  <text x="145.59999999999997" y="470.08000000000004" font-size="16" fill="#1a1a1a">,</text>
  <text x="151.19999999999996" y="470.08000000000004" font-size="16" fill="#1a1a1a"> inline formulations such as </text>
  <text x="371.20000000000005" y="470.08000000000004" font-size="16" fill="#24292f" font-style="italic">f</text>
  <text x="380.00000000000006" y="470.08000000000004" font-size="16" fill="#24292f" font-style="italic">x</text>
  <text x="388.80000000000007" y="470.08000000000004" font-size="16" fill="#24292f"> = </text>
  <text x="407.20000000000005" y="470.08000000000004" font-size="16" fill="#24292f">√</text>
  <text x="423.20000000000005" y="470.08000000000004" font-size="16" fill="#24292f" font-style="italic">x</text>
  <text x="432.00000000000006" y="470.08000000000004" font-size="16" fill="#24292f"> ^ </text>
  <text x="450.40000000000003" y="470.08000000000004" font-size="16" fill="#24292f" font-style="italic">2</text>
  <text x="459.20000000000005" y="470.08000000000004" font-size="16" fill="#24292f"> + </text>
  <text x="477.6" y="470.08000000000004" font-size="16" fill="#24292f" font-style="italic">1</text>
  <text x="486.40000000000003" y="470.08000000000004" font-size="16" fill="#1a1a1a"> and fraction derivations</text>
  <text x="678.4000000000001" y="470.08000000000004" font-size="16" fill="#1a1a1a">:</text>
  <text x="80" y="520.8000000000001" font-size="19.2" fill="#24292f" font-style="italic">frac</text>
  <text x="122.24000000000001" y="520.8000000000001" font-size="19.2" fill="#24292f" font-style="italic">a</text>
  <text x="132.8" y="520.8000000000001" font-size="19.2" fill="#24292f"> + </text>
  <text x="154.88" y="520.8000000000001" font-size="19.2" fill="#24292f" font-style="italic">b</text>
  <text x="165.44" y="520.8000000000001" font-size="19.2" fill="#24292f"> , </text>
  <text x="183.68" y="520.8000000000001" font-size="19.2" fill="#24292f" font-style="italic">c</text>
  <text x="194.24" y="520.8000000000001" font-size="19.2" fill="#24292f"> + </text>
  <text x="216.32" y="520.8000000000001" font-size="19.2" fill="#24292f" font-style="italic">d</text>
  <text x="48" y="562.88" font-size="16" fill="#1a1a1a">maintain harmonic font metrics and balanced baseline alignments across heterogeneous output devices.</text>
  <text x="48" y="618.3199999999999" font-size="22.4" fill="#1a1a1a" font-weight="bold">Architecture Overview</text>
  <text x="48" y="642" font-size="16" fill="#1a1a1a">The system pipeline consists of three decoupled phases</text>
  <text x="473.60000000000036" y="642" font-size="16" fill="#1a1a1a">:</text>
  <text x="64" y="678" font-size="16" fill="#0969da" font-weight="bold">• </text>
  <text x="88.8" y="678" font-size="16" fill="#1a1a1a">Lexical Tokenization &amp; Parsing</text>
  <text x="321.6000000000001" y="678" font-size="16" fill="#1a1a1a">:</text>
  <text x="330.4000000000001" y="678" font-size="16" fill="#1a1a1a"> Recursive descent parser yielding lossless AST nodes</text>
  <text x="64" y="706" font-size="16" fill="#0969da" font-weight="bold">• </text>
  <text x="88.8" y="706" font-size="16" fill="#1a1a1a">Geometric Layout Engine</text>
  <text x="274.40000000000003" y="706" font-size="16" fill="#1a1a1a">:</text>
  <text x="283.20000000000005" y="706" font-size="16" fill="#1a1a1a"> Bounding box calculation</text>
  <text x="475.20000000000005" y="706" font-size="16" fill="#1a1a1a">,</text>
  <text x="480.80000000000007" y="706" font-size="16" fill="#1a1a1a"> font metric estimation</text>
  <text x="656.8000000000001" y="706" font-size="16" fill="#1a1a1a">,</text>
  <text x="48" y="730" font-size="16" fill="#1a1a1a"> and page break partitioning</text>
  <text x="64" y="758" font-size="16" fill="#0969da" font-weight="bold">• </text>
  <text x="88.8" y="758" font-size="16" fill="#1a1a1a">Dual-Target Vector Renderer</text>
  <text x="308.80000000000007" y="758" font-size="16" fill="#1a1a1a">:</text>
  <text x="48" y="782" font-size="16" fill="#1a1a1a"> SVG 1.1 vector paths and semantic HTML5 DOM structures</text>
  <text x="48" y="841.4399999999999" font-size="22.4" fill="#1a1a1a" font-weight="bold">Empirical Results</text>
  <text x="48" y="865.12" font-size="16" fill="#1a1a1a">Run </text>
  <rect x="77.2" y="849.52" width="466.96000000000015" height="20" fill="#f4f4f6" rx="3"/>
  <text x="79.2" y="863.76" font-size="14.4" fill="#d73a49" class="mono">moon bench benchmarks --target wasm-gc --release --deny-warn</text>
  <text x="546.1600000000002" y="865.12" font-size="16" fill="#1a1a1a"> and record the host</text>
  <text x="699.7600000000002" y="865.12" font-size="16" fill="#1a1a1a">,</text>
  <text x="48" y="889.12" font-size="16" fill="#1a1a1a"> MoonBit version</text>
  <text x="175.2" y="889.12" font-size="16" fill="#1a1a1a">,</text>
  <text x="180.79999999999998" y="889.12" font-size="16" fill="#1a1a1a"> and raw results before making WebAssembly performance comparisons.</text>
</svg>
