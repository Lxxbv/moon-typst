  <text x="48" y="1122.16" font-size="22.4" fill="#1a1a1a" font-weight="bold">Conclusion &amp; Recommendations</text>
  <text x="48" y="1145.84" font-size="16" fill="#1a1a1a">Use the same input</text>
  <text x="188.79999999999998" y="1145.84" font-size="16" fill="#1a1a1a">,</text>
  <text x="194.39999999999998" y="1145.84" font-size="16" fill="#1a1a1a"> target</text>
  <text x="245.59999999999997" y="1145.84" font-size="16" fill="#1a1a1a">,</text>
  <text x="251.19999999999996" y="1145.84" font-size="16" fill="#1a1a1a"> toolchain</text>
  <text x="325.59999999999997" y="1145.84" font-size="16" fill="#1a1a1a">,</text>
  <text x="48" y="1169.84" font-size="16" fill="#1a1a1a"> and host conditions when comparing runs. The stage timings cannot be added to claim CLI latency because setup and serialization differ from an end-to-end run.</text>
