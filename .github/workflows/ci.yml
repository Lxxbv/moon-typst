name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check Toolchain Version
        run: |
          moon version --all

      - name: Verify Code Formatting
        run: |
          moon fmt --check

      - name: MoonBit Check (Deny Warnings)
        run: |
          moon check --deny-warn

      - name: Run Test Suite
        run: |
          moon test --deny-warn

      - name: Build WebAssembly Target
        run: |
          moon build --target wasm-gc

      - name: Build JavaScript Target
        run: |
          moon build --target js

      - name: Build Native CLI Executable
        run: |
          moon build --target native

      - name: Verify Examples Rendering
        shell: bash
        run: |
          moon run cmd/main --target native -- examples/paper.typ -o paper_ci.svg
          moon run cmd/main --target native -- examples/paper.typ --html -o paper_ci.html
          moon run cmd/main --target native -- examples/resume.typ -o resume_ci.svg
          moon run cmd/main --target native -- examples/report.typ -o report_ci.svg
          test -s paper_ci.svg
          test -s paper_ci.html
          test -s resume_ci.svg
          test -s report_ci.svg
